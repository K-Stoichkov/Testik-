<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Живой ASCII-фон</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0d11;
    overflow: hidden;
    font-family: "Courier New", monospace;
  }
  #ascii-bg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; pointer-events: none;
  }
  /* Мягкое свечение сверху — как на сайте LOOTBAR */
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, rgba(108,92,231,.12), transparent 60%);
  }
</style>
</head>
<body>
  <canvas id="ascii-bg" aria-hidden="true"></canvas>
  <div class="glow"></div>

<script>
(function () {
  const canvas = document.getElementById('ascii-bg');
  const ctx = canvas.getContext('2d');
  const chars = '01#*+=-<>[]{}/\\|:;.$%@';
  const fontSize = 14;
  const settings = { speed: [0.12, 0.52], length: [5, 19], opacity: 0.55, fps: 18 };
  let columns = [], width = 0, height = 0, last = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = () => chars[Math.floor(Math.random() * chars.length)];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = fontSize + 'px "Courier New", monospace';
    ctx.textBaseline = 'top';
    columns = Array.from({ length: Math.ceil(width / fontSize) }, () => ({
      y: rand(0, height / fontSize),
      speed: rand(settings.speed[0], settings.speed[1]),
      len: Math.floor(rand(settings.length[0], settings.length[1])),
      signs: Array.from({ length: 28 }, pick)
    }));
  }

  function frame(time) {
    requestAnimationFrame(frame);
    if (time - last < 1000 / settings.fps) return;
    last = time;
    ctx.clearRect(0, 0, width, height);
    columns.forEach((col, i) => {
      const head = Math.floor(col.y);
      for (let k = 0; k < col.len; k++) {
        const row = head - k;
        if (row < 0 || row * fontSize > height) continue;
        const alpha = (1 - k / col.len) * settings.opacity;
        ctx.fillStyle = k === 0 ? 'rgba(200,190,255,0.95)' : `rgba(140,120,255,${alpha})`;
        ctx.fillText(col.signs[(Math.abs(row) + k) % col.signs.length], i * fontSize, row * fontSize);
      }
      col.y += col.speed;
      if ((col.y - col.len) * fontSize > height) {
        col.y = -rand(0, 20);
        col.speed = rand(settings.speed[0], settings.speed[1]);
        col.len = Math.floor(rand(settings.length[0], settings.length[1]));
      }
    });
  }

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(frame);
  } else {
    resize();
  }
})();
</script>
</body>
</html>
